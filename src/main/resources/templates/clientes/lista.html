<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><body><div th:fragment="content">
<h2>Clientes</h2>
<a th:if="${#authorization.expression('hasRole(''ATENDENTE'')')}" th:href="@{/clientes/novo}" class="btn btn-primary mb-3">Novo cliente</a>
<table class="table"><thead><tr><th>Nome</th><th>Telefone</th><th>Endereço</th><th>Ações</th></tr></thead><tbody>
<tr th:each="cliente : ${clientes}"><td th:text="${cliente.nome}"></td><td th:text="${cliente.telefone}"></td>
<td><span th:text="${cliente.logradouro}"></span> <span th:text="${cliente.numero}"></span> <span th:text="${cliente.bairro}"></span> <span th:text="${cliente.cidade}"></span></td>
<td th:if="${#authorization.expression('hasRole(''ATENDENTE'')')}"><a class="btn btn-sm btn-outline-primary" th:href="@{/clientes/editar/{id}(id=${cliente.id})}">Editar</a>
<button type="button" class="btn btn-sm btn-outline-danger" th:attr="data-cliente=${cliente.id}" onclick="excluirCliente(this.dataset.cliente)">Excluir</button></td></tr>
</tbody></table>
<script>
async function excluirCliente(identificador) {
    if (!confirm('Excluir este cliente?')) return;
    const resposta = await fetch('/api/clientes/' + encodeURIComponent(identificador), {method:'DELETE'});
    if (resposta.ok) location.reload();
    else { const erro = await resposta.json().catch(() => ({})); alert(erro.erro || 'Operação não permitida'); }
}
</script></div></body></html>
